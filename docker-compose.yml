services:

  # ========================================================
  # PostgreSQL + pgvector
  # ========================================================

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped

    environment:
      POSTGRES_DB: clinicflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - clinicflow_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ========================================================
  # Redis
  # ========================================================

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - clinicflow_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ========================================================
  # MCP Server
  # ========================================================

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile

    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}

      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/clinicflow_db

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}

      REDIS_URL: redis://redis:6379/0

      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}

      MCP_SERVER_URL: http://mcp-server:8001/mcp

    ports:
      - "8001:8001"

    depends_on:
      postgres:
        condition: service_healthy


  # ========================================================
  # FastAPI Backend
  # ========================================================

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    image: clinicflow-backend:latest
    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}

      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/clinicflow_db

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}

      REDIS_URL: redis://redis:6379/0

      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}

      MCP_SERVER_URL: http://mcp-server:8001/mcp

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      mcp-server:
        condition: service_started


  # ========================================================
  # React Frontend
  # ========================================================

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    image: clinicflow-ai-frontend:latest
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_started


  # ========================================================
  # Prometheus
  # ========================================================

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - clinicflow_prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    depends_on:
      backend:
        condition: service_started


  # ========================================================
  # Grafana
  # ========================================================

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - clinicflow_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      prometheus:
        condition: service_started


# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:

  clinicflow_postgres_data:
    name: clinicflow_postgres_data

  clinicflow_redis_data:
    name: clinicflow_redis_data

  clinicflow_prometheus_data:
    name: clinicflow_prometheus_data

  clinicflow_grafana_data:
    name: clinicflow_grafana_data